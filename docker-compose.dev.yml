# IronShield EDR — local development (queue-first ingestion, optional Kafka)
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: edr-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: edr_platform
      MYSQL_USER: ${MYSQL_USER:-edr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edrdev}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edr-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./server-node
      dockerfile: Dockerfile
    container_name: edr-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-edr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-edrdev}
      DB_NAME: edr_platform
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-long!!}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-dev-agent-registration-token-32}
      REDIS_URL: redis://redis:6379
      INGEST_QUEUE_FIRST: 'true'
      KAFKA_ENABLED: 'false'
      XDR_INGEST_KEY: ${XDR_INGEST_KEY:-dev-xdr-ingest-key}
      AGENT_REQUEST_SIGNING_REQUIRED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server-node:/app
    command: npm run dev

  worker:
    build:
      context: ./server-node
      dockerfile: Dockerfile
    container_name: edr-worker-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-edr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-edrdev}
      DB_NAME: edr_platform
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-long!!}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-dev-agent-registration-token-32}
      REDIS_URL: redis://redis:6379
      INGEST_QUEUE_FIRST: 'true'
    depends_on:
      - backend
      - redis
    command: npm run worker

volumes:
  mysql_data_dev:
